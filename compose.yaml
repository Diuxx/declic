services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: declic-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.containers.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-test}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: declic-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped
