# Logs
logging.level.com.nico.declic=INFO

# Fichier de logs, en plus de la console
logging.file.name=${LOG_DIR:logs}/declic-prod.log

# Rotation
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:logs}/declic-prod.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.clean-history-on-start=true

# Réponses HTTP sans détails internes
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never