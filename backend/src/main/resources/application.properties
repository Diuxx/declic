spring.application.name=
server.port=8080

# OpenAI configuration
app.ai.provider=${AI_PROVIDER:ollama}
app.ai.openai.api-model=${OPENAI_MODEL:gpt-4.1-mini}
app.ai.openai.api-key=${OPENAI_API_KEY:test}

# Ollama configuration
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:ministral-3:3b}

app.ai.max-retries=0
app.ai.connect-timeout=5s
app.ai.read-timeout=60s

# Logs
logging.level.root=INFO